<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>游园惊梦 - 访问验证</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        :root {
            --primary: #8B4513;
            --primary-light: #A0522D;
            --secondary: #6B8E8E;
            --background: #F5F0E8;
            --text: #3D3D3D;
            --gold: #C9A962;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .auth-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .auth-title {
            font-size: 28px;
            color: var(--primary);
            font-family: 'STKaiti', 'Kaiti SC', serif;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--secondary);
            margin-bottom: 30px;
        }

        .password-input-group {
            margin-bottom: 20px;
        }

        .password-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 4px;
        }

        .password-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.1);
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            color: white;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'STKaiti', 'Kaiti SC', serif;
            letter-spacing: 4px;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 69, 19, 0.3);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            padding: 10px;
            background: #ffebee;
            border-radius: 5px;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-icon">🎭</div>
        <h1 class="auth-title">游园惊梦</h1>
        <p class="auth-subtitle">请输入访问密码</p>

        <div class="password-input-group">
            <input type="password"
                   id="password"
                   class="password-input"
                   placeholder="请输入密码"
                   autocomplete="current-password">
        </div>

        <button class="submit-button" onclick="verifyPassword()">进入</button>

        <div class="error-message" id="error-message">密码错误，请重试</div>

        <p class="footer-text">昆曲文化传承互动体验</p>
    </div>

    <script>
        function verifyPassword() {
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');

            if (!password) {
                showError('请输入密码');
                return;
            }

            fetch('/api/auth/verify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ password: password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // 认证成功，重新加载页面
                    window.location.href = '/';
                } else {
                    showError(data.error || '密码错误');
                }
            })
            .catch(err => {
                console.error('验证失败:', err);
                showError('验证失败，请重试');
            });
        }

        function showError(message) {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = message;
            errorElement.classList.add('show');

            setTimeout(() => {
                errorElement.classList.remove('show');
            }, 3000);
        }

        // 回车键提交
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyPassword();
            }
        });
    </script>
</body>
</html>
